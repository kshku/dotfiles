# Autostart

exec-once = ~/Git/dotfiles/scripts/desktop-portal.sh
exec-once = systemctl --user start hyprpolkitagent
exec-once = waybar
exec-once = hypridle
exec-once = hyprpaper
exec-once = dunst

# Cliphist
exec-once = wl-paste --type text --watch cliphist store # text data
exec-once = wl-paste --type image --watch cliphist store # image data

# Theme
exec = gsettings set org.gnome.desktop.interface gtk-theme "Adwaita-dark" # for GTK3 apps
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark" # for GTK4 apps
